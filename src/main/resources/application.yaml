spring:
  application:
    name: logscope
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: false
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logscope:
  search:
    enabled: ${SEARCH_ENABLED:false}
    url: ${SEARCH_URL:http://elasticsearch:9200}
