<!doctype html>
<html lang="ko">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>logscope 샘플 WAS</title>
  <style>
    body {
      max-width: 700px;
      margin: 3rem auto;
      padding: 1rem;
      font: 18px system-ui;
      background: #f7f9fc;
      color: #182234;
    }
    button,
    select {
      font: inherit;
      padding: 0.6rem;
      margin: 0.4rem;
    }
    li {
      overflow-wrap: anywhere;
      margin: 1rem 0;
    }
    #notice {
      min-height: 2rem;
    }
  </style>
  <h1>샘플 WAS <span id="instance"></span></h1>
  <p>
    각 WAS가 1분마다 랜덤 로그를 파일에 기록합니다. Vector가 파일을 읽어
    logscope로 전송합니다.
  </p>
  <p id="auto"></p>
  <button id="toggle" disabled>자동 생성 전환</button>
  <form id="generate">
    <label for="level">로그 레벨</label
    ><select id="level">
      <option>INFO</option>
      <option>TRACE</option>
      <option>DEBUG</option>
      <option>WARN</option>
      <option>ERROR</option>
      <option value="RANDOM">랜덤</option></select
    ><button id="create">로그 생성</button
    ><button type="button" id="exception">예외 발생</button>
  </form>
  <p id="notice" role="status" aria-live="polite"></p>
  <h2>최근 수동 생성 결과</h2>
  <p>
    아래는 로그 생성 요청 결과입니다. 중앙 저장 성공은 logscope 탐색 화면에서
    확인하세요. 최대 20건이며 화면을 닫으면 초기화됩니다.
  </p>
  <ul id="recent"></ul>
  <script src="/sample.js" defer></script>
</html>
