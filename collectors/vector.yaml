data_dir: /var/lib/vector
sources:
  sample_files:
    type: file
    include: ["/logs/events*.jsonl"]
    read_from: beginning
    max_line_bytes: 262144
    fingerprint:
      strategy: device_and_inode
transforms:
  events:
    type: remap
    inputs: [sample_files]
    drop_on_error: true
    source: |
      . = parse_json!(string!(.message))
sinks:
  logscope:
    type: http
    inputs: [events]
    uri: http://app:8080/api/v1/logs/batch
    acknowledgements:
      enabled: true
    method: post
    encoding:
      codec: json
    framing:
      method: character_delimited
      character_delimited:
        delimiter: ","
    request:
      headers:
        Content-Type: application/json
      concurrency: 1
      timeout_secs: 3
      retry_attempts: 2
    batch:
      max_events: 100
      max_bytes: 65536
      timeout_secs: 2
    buffer:
      type: memory
      max_events: 100
      when_full: block
    healthcheck:
      enabled: false
