name: logscope
services:
  db:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: logscope
      MYSQL_USER: ${DB_USERNAME:?Set DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" -D logscope -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  elasticsearch:
    build: ./elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      action.auto_create_index: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: ["elasticsearch-data:/usr/share/elasticsearch/data"]
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
    restart: unless-stopped
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_URL: ${DB_URL:?Set DB_URL}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      SEARCH_ENABLED: "true"
      SEARCH_URL: http://elasticsearch:9200
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      LOGSCOPE_API_BASE_URL: http://app:8080
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
  sample-was-1:
    profiles: [samples]
    build:
      context: .
      dockerfile: sample-was/Dockerfile
    environment:
      INSTANCE_ID: was-1
      SAMPLE_LOG_DIR: /logs
    ports: ["127.0.0.1:8081:8080"]
    volumes: ["sample-one-logs:/logs"]
    restart: unless-stopped
  vector-1:
    profiles: [samples]
    image: timberio/vector:0.60.0-debian
    volumes:
      - ./collectors/vector.yaml:/etc/vector/vector.yaml:ro
      - sample-one-logs:/logs:ro
      - vector-one-data:/var/lib/vector
    depends_on: [sample-was-1, app]
    restart: unless-stopped
  sample-was-2:
    profiles: [samples]
    build:
      context: .
      dockerfile: sample-was/Dockerfile
    environment:
      INSTANCE_ID: was-2
      SAMPLE_LOG_DIR: /logs
    ports: ["127.0.0.1:8082:8080"]
    volumes: ["sample-two-logs:/logs"]
    restart: unless-stopped
  vector-2:
    profiles: [samples]
    image: timberio/vector:0.60.0-debian
    volumes:
      - ./collectors/vector.yaml:/etc/vector/vector.yaml:ro
      - sample-two-logs:/logs:ro
      - vector-two-data:/var/lib/vector
    depends_on: [sample-was-2, app]
    restart: unless-stopped
volumes:
  elasticsearch-data:
  mysql-data:
  sample-one-logs:
  sample-two-logs:
  vector-one-data:
  vector-two-data:
